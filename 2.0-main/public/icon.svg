<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="topFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="leftFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="rightFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="accentGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#334155" stroke-width="4" stroke-opacity="0.6"/>

  <!-- Subtle grid lines in background -->
  <path d="M 96 160 L 416 160 M 96 256 L 416 256 M 96 352 L 416 352" stroke="#1e293b" stroke-width="2" stroke-dasharray="6,6"/>
  <path d="M 160 96 L 160 416 M 256 96 L 256 416 M 352 96 L 352 416" stroke="#1e293b" stroke-width="2" stroke-dasharray="6,6"/>

  <!-- 3D Isometric Cube Main Structure -->
  <g transform="translate(0, -10)">
    <!-- Top Face -->
    <polygon points="256,110 384,180 256,250 128,180" fill="url(#topFace)" stroke="#a5b4fc" stroke-width="3" stroke-linejoin="round"/>
    
    <!-- Top Face Grid Segments (2x2 cut marks) -->
    <line x1="192" y1="145" x2="320" y2="215" stroke="#c7d2fe" stroke-width="2" stroke-opacity="0.8"/>
    <line x1="320" y1="145" x2="192" y2="215" stroke="#c7d2fe" stroke-width="2" stroke-opacity="0.8"/>

    <!-- Left Face -->
    <polygon points="128,180 256,250 256,390 128,320" fill="url(#leftFace)" stroke="#6366f1" stroke-width="3" stroke-linejoin="round"/>
    
    <!-- Left Face Grid Segments -->
    <line x1="128" y1="250" x2="256" y2="320" stroke="#818cf8" stroke-width="2" stroke-opacity="0.6"/>
    <line x1="192" y1="215" x2="192" y2="355" stroke="#818cf8" stroke-width="2" stroke-opacity="0.6"/>

    <!-- Right Face -->
    <polygon points="256,250 384,180 384,320 256,390" fill="url(#rightFace)" stroke="#818cf8" stroke-width="3" stroke-linejoin="round"/>
    
    <!-- Right Face Grid Segments -->
    <line x1="384" y1="250" x2="256" y2="320" stroke="#a5b4fc" stroke-width="2" stroke-opacity="0.6"/>
    <line x1="320" y1="215" x2="320" y2="355" stroke="#a5b4fc" stroke-width="2" stroke-opacity="0.6"/>
  </g>

  <!-- Glowing Corner Highlights -->
  <circle cx="256" cy="100" r="6" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="384" cy="170" r="5" fill="#818cf8"/>
  <circle cx="128" cy="170" r="5" fill="#818cf8"/>
  <circle cx="256" cy="240" r="6" fill="#fbbf24" filter="url(#glow)"/>

  <!-- Floating Golden Math / Geometry Badges -->
  <g transform="translate(256, 430)">
    <rect x="-110" y="-22" width="220" height="40" rx="20" fill="#0f172a" stroke="#4f46e5" stroke-width="2.5"/>
    <text x="0" y="5" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" text-anchor="middle" letter-spacing="3">3D MATH LAB</text>
  </g>

  <!-- Math Symbols Floating -->
  <text x="75" y="130" fill="#38bdf8" font-family="monospace" font-size="28" font-weight="bold" opacity="0.85">πr²</text>
  <text x="385" y="130" fill="#34d399" font-family="monospace" font-size="26" font-weight="bold" opacity="0.85">V=a³</text>
  <text x="65" y="420" fill="#f472b6" font-family="monospace" font-size="24" font-weight="bold" opacity="0.75">2πrh</text>
  <text x="390" y="420" fill="#fbbf24" font-family="monospace" font-size="24" font-weight="bold" opacity="0.8">n³</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradMaskable" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="topFaceMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="leftFaceMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="rightFaceMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <filter id="glowMask" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full Bleed Background (no rounded corners so it can be masked safely) -->
  <rect width="512" height="512" fill="url(#bgGradMaskable)"/>

  <!-- Centered Safe Zone Graphic (Scale to fit in safe 80% area) -->
  <g transform="translate(256, 256) scale(0.8) translate(-256, -256)">
    <!-- 3D Isometric Cube Main Structure -->
    <g transform="translate(0, -20)">
      <!-- Top Face -->
      <polygon points="256,120 376,185 256,250 136,185" fill="url(#topFaceMask)" stroke="#a5b4fc" stroke-width="3" stroke-linejoin="round"/>
      <line x1="196" y1="152" x2="316" y2="217" stroke="#c7d2fe" stroke-width="2" stroke-opacity="0.8"/>
      <line x1="316" y1="152" x2="196" y2="217" stroke="#c7d2fe" stroke-width="2" stroke-opacity="0.8"/>

      <!-- Left Face -->
      <polygon points="136,185 256,250 256,380 136,315" fill="url(#leftFaceMask)" stroke="#6366f1" stroke-width="3" stroke-linejoin="round"/>
      <line x1="136" y1="250" x2="256" y2="315" stroke="#818cf8" stroke-width="2" stroke-opacity="0.6"/>
      <line x1="196" y1="217" x2="196" y2="347" stroke="#818cf8" stroke-width="2" stroke-opacity="0.6"/>

      <!-- Right Face -->
      <polygon points="256,250 376,185 376,315 256,380" fill="url(#rightFaceMask)" stroke="#818cf8" stroke-width="3" stroke-linejoin="round"/>
      <line x1="376" y1="250" x2="256" y2="315" stroke="#a5b4fc" stroke-width="2" stroke-opacity="0.6"/>
      <line x1="316" y1="217" x2="316" y2="347" stroke="#a5b4fc" stroke-width="2" stroke-opacity="0.6"/>
    </g>

    <circle cx="256" cy="100" r="6" fill="#38bdf8" filter="url(#glowMask)"/>
    <circle cx="256" cy="230" r="6" fill="#fbbf24" filter="url(#glowMask)"/>

    <!-- Label Badge -->
    <g transform="translate(256, 420)">
      <rect x="-105" y="-20" width="210" height="40" rx="20" fill="#0f172a" stroke="#4f46e5" stroke-width="2.5"/>
      <text x="0" y="6" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" text-anchor="middle" letter-spacing="2">3D MATH LAB</text>
    </g>
  </g>
</svg>
